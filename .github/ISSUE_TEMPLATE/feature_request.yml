name: "💡 功能建议"
description: 提出新格式、新视图或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提议！请先确认建议不违背项目的几条原则：**原文件零搬移、仅内网、零 npm 运行时依赖、默认离线可用**。
        需要公网分享、云同步或多租户账号体系的想法，通常不适合本项目，可以先开讨论。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述实际使用场景，而不只是解决方案
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的实现方式
      description: 例如新增阅读格式、改进分类规则、增加筛选维度等
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 该建议不需要把站点暴露到公网，也不需要外部 CDN / 新增 npm 运行时依赖
          required: true
        - label: 该建议不会移动或删除用户原有的资料文件
          required: true
