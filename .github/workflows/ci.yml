name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          for f in server/*.js public/app.js public/office.js public/notes.js; do
            node --check "$f" || exit 1
          done
          echo "JavaScript syntax OK"

      - name: Private config is not committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::Local config must never be committed"
            exit 1
          fi
          test -f .env.example
          if grep -nE '192\.168\.[0-9]+\.[0-9]+|/volume[0-9]/' docker-compose.yml Dockerfile; then
            echo "::error::Hardcoded private address or NAS path in deploy config"
            exit 1
          fi
          echo "No private config in tracked deploy files"

      - name: Validate SVG diagrams (README + Figma showcase)
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files = sorted(glob.glob('docs/images/*.svg') + glob.glob('docs/figma/*.svg') +
                         glob.glob('docs/figma/frames/*.svg'))
          assert len(files) >= 12, f'expected diagrams + Figma frames, got {len(files)}'
          for p in files:
              ET.parse(p)
              if p.startswith('docs/images/'):
                  png = p[:-4] + '.png'
                  assert os.path.exists(png) and os.path.getsize(png) > 1000, \
                      f'missing PNG preview for {p}'
          for p in ('docs/figma/lantern-desk-showcase.png', 'docs/figma/preview.html',
                    'docs/figma/README.md', 'docs/figma/build.py'):
              assert os.path.exists(p) and os.path.getsize(p) > 100, f'missing {p}'
          print('valid SVG files:', len(files))
          PY

      - name: Provenance and Figma docs
        run: |
          python3 - <<'PY'
          s = open('README.md', encoding='utf8').read()
          assert '完全由 AI 生成' in s, 'README must state the project is AI-generated'
          assert 'FIGMA_SHARE_URL' in s, 'README must keep the Figma share-link placeholder'
          assert 'MIT' in open('LICENSE', encoding='utf8').read()
          print('AI-generated notice, Figma placeholder and MIT license OK')
          PY

      - name: Check local documentation links
        run: |
          python3 - <<'PY'
          import re, os, glob
          docs = ['README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'CHANGELOG.md',
                  'THIRD_PARTY_NOTICES.md'] + glob.glob('docs/*.md') + \
                 glob.glob('docs/**/*.md', recursive=True)
          docs = sorted(set(docs))
          bad = []
          for md in docs:
              s = open(md, encoding='utf8').read()
              # 剥离围栏与行内代码片段，避免其中的示例链接被误判为文档链接
              s = re.sub(r'```[\s\S]*?```', '', s)
              s = re.sub(r'`[^`\n]*`', '', s)
              for target in re.findall(r'\]\(([^)#]+)(?:#[^)]*)?\)', s):
                  if target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  rel = target.split('#')[0]
                  if not rel:
                      continue
                  p = os.path.normpath(os.path.join(os.path.dirname(md), rel))
                  if not os.path.exists(p):
                      bad.append((md, target))
          if bad:
              for b in bad:
                  print('BROKEN LINK:', b)
              raise SystemExit(1)
          print('local links OK:', len(docs), 'documents')
          PY

      - name: Build Docker image
        run: docker build -t lan-library:ci .
